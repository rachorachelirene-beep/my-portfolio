<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - Tomasz Gajda Style</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Font Awesome para sa icons (GitHub, LinkedIn, Email) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <header class="hero-container">
    <!-- LEFT SIDE -->
    <div class="left-side">
      <div class="logo">
        <h2>RIR</h2> <!-- O bisan unsang initials nimo -->
      </div>

      <div class="hero-text">
        <p class="greeting">Hi, I am</p>
        <h1 class="name">Rachel Irene Racho</h1>
        <p class="role">Front-end Developer / UI Designer</p>

        <div class="social-links">
  <!-- Email -->
  <a href="mailto:your_email@gmail.com" class="social-btn" title="Email Me">
    <i class="fa-solid fa-at"></i>
  </a>
  <!-- GitHub -->
  <a href="https://github.com/your-username" target="_blank" class="social-btn" title="GitHub">
    <i class="fa-brands fa-github"></i>
  </a>
  <!-- LinkedIn -->
  <a href="https://linkedin.com/in/your-username" target="_blank" class="social-btn" title="LinkedIn">
    <i class="fa-brands fa-linkedin-in"></i>
  </a>
</div>
      </div>
    </div>

    <!-- RIGHT SIDE (Dark Side) -->
    <div class="right-side">
      <nav class="navbar">
        <a href="#about">About me</a>
        <a href="#skills">Skills</a>
        <a href="#portfolio">Portfolio</a>
        <a href="#contact" class="btn-contact">CONTACT ME</a>
      </nav>
    </div>

    <!-- FLOATING PROFILE IMAGE (Tungatunga sa duha) -->
    <div class="image-wrapper">
<img src="profile.png" alt="Rachel Irene Racho" class="profile-img" />
    </div>
  </header>

</body>
</html>
